name: Live Codex OAuth Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to call through the Codex OAuth backend"
        required: true
        default: "gpt-5.5"

permissions:
  contents: read

jobs:
  live-smoke:
    name: Live LLM smoke test
    runs-on: ubuntu-latest
    env:
      CODEX_OAUTH_ACCESS_TOKEN: ${{ secrets.CODEX_OAUTH_ACCESS_TOKEN }}
      CODEX_OAUTH_REFRESH_TOKEN: ${{ secrets.CODEX_OAUTH_REFRESH_TOKEN }}
      CODEX_OAUTH_ACCOUNT_ID: ${{ secrets.CODEX_OAUTH_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Require Codex OAuth secret
        shell: bash
        run: |
          if [ -z "$CODEX_OAUTH_ACCESS_TOKEN" ]; then
            echo "CODEX_OAUTH_ACCESS_TOKEN secret is required for live smoke tests." >&2
            exit 1
          fi

      - name: Run live smoke test
        env:
          CODEX_OAUTH_LIVE: "1"
          CODEX_OAUTH_LIVE_MODEL: ${{ inputs.model }}
        run: python -m pytest -q tests/test_live.py

